name: threads-refresh-token

# 長期トークンは60日で切れるので、毎月1日に延長してSecretを上書きする。
# Secret更新には repo の Secrets 書き込み権限を持つ PAT（GH_PAT）が必要。
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh and store token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(python refresh_token.py)
          echo "::add-mask::$NEW_TOKEN"
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
