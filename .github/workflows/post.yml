name: threads-post

on:
  schedule:
    # JST 7:30 / 12:00 / 21:00 前後（GitHubのcronは数分〜十数分遅れることがある）
    - cron: "30 22 * * *"
    - cron: "0 3 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post due entries
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: python post.py
      - name: Save queue state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Update queue state"
            git push
          fi
